<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.3" />

  <!-- Inner ambient circle -->
  <circle cx="256" cy="256" r="170" fill="#f59e0b" fill-opacity="0.06" />

  <!-- Musical Beam Notes & Altar Cross motif -->
  <g filter="url(#glow)">
    <!-- Stems and beam -->
    <path d="M190 320 L190 170 C190 155 200 145 215 145 L325 125 C340 122 352 135 352 150 L352 280" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Horizontal Beam -->
    <path d="M190 190 L352 162" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Left Note Head -->
    <ellipse cx="160" cy="325" rx="42" ry="32" transform="rotate(-20 160 325)" fill="url(#goldGrad)" />
    <!-- Right Note Head -->
    <ellipse cx="322" cy="285" rx="42" ry="32" transform="rotate(-20 322 285)" fill="url(#goldGrad)" />
  </g>
</svg>
